# База сервиса на Spring. Порт 5433 и база learning_spring — чтобы не делить
# историю Flyway и порт с Ktor-версией (5432, learning_platform).
services:
  postgres:
    image: postgres:18-alpine
    container_name: spring_postgres
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-learning_spring}
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres_password}
    ports:
      - "5433:5432"
    volumes:
      # PostgreSQL 18: данные в /var/lib/postgresql/18/docker, том монтируется на уровень выше
      - spring_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-postgres} -d ${DATABASE_NAME:-learning_spring}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  spring_postgres_data:
