# База сервиса на Spring. Порт 5433 и база learning_spring — чтобы не делить
# историю Flyway и порт с Ktor-версией (5432, learning_platform).
# docker compose up -d                    — только база (уроки 1–14, 16–21)
# docker compose --profile oauth up -d    — плюс Keycloak на 8180 (урок 15)
# docker compose --profile kafka up -d    — плюс брокер Kafka на 9092 (глава 6)
services:
  postgres:
    image: postgres:18-alpine
    container_name: spring_postgres
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-learning_spring}
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres_password}
    ports:
      - "5433:5432"
    volumes:
      # PostgreSQL 18: данные в /var/lib/postgresql/18/docker, том монтируется на уровень выше
      - spring_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-postgres} -d ${DATABASE_NAME:-learning_spring}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Урок 15: провайдер входа. Режим start-dev — только для учебной машины (HTTP, база в контейнере).
  # Realm learning, клиент service-spring и тестовые пользователи — keycloak/realm-learning.json,
  # тестовые значения — README модуля. Консоль администратора: http://localhost:8180/admin
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    container_name: spring_keycloak
    profiles: ["oauth"]
    command: ["start-dev", "--import-realm", "--http-port=8180"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin-local-pass
    ports:
      - "8180:8180"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro

  # Глава 6: брокер Kafka — одна нода в режиме KRaft (без ZooKeeper), тот же образ, что в тестах.
  # Два листенера: localhost:9092 — для сервисов, запущенных на машине (bootRun, IDE),
  # kafka:29092 — для контейнеров внутри сети Compose.
  kafka:
    image: apache/kafka:4.2.2
    container_name: spring_kafka
    profiles: ["kafka"]
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: -Xmx512m -Xms512m
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10

volumes:
  spring_postgres_data:
