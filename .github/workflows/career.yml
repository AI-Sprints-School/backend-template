# CI главы 4 курса «Карьерная подготовка бэкенд-разработчика» (career/algorithms/) —
# готовый, править не нужно.
# 1. Номер урока берёт из имени ветки career-NN (13..16 — остальные уроки главы
#    без кода этот workflow не трогает: paths ограничивает его career/algorithms/**).
# 2. Прогоняет тесты урока и перегенерирует career/reports/algorithms-NN.txt.
# 3. Падает, если закоммиченный отчёт не совпадает с прогоном в CI.
# 4. Падает, если в отчёте есть красные тесты.
# Модуль корутин (coroutines/**) и сервис (service/**) проверяются своими
# workflow — сюда их изменения не попадают.
name: career

on:
  pull_request:
    paths: ["career/algorithms/**"]

jobs:
  lesson:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Номер урока из имени ветки
        id: lesson
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          if [[ "$BRANCH" =~ ^career-(1[3-6])$ ]]; then
            echo "number=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
            echo "Урок ${BASH_REMATCH[1]}"
          else
            echo "::error::для урока с кодом ветка должна называться career-13 … career-16 (сейчас: $BRANCH)"
            exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v5

      - name: Тесты и отчёт урока ${{ steps.lesson.outputs.number }}
        run: ./gradlew :career:testReport -Plesson=${{ steps.lesson.outputs.number }}

      - name: Отчёт в PR совпадает с прогоном CI
        run: |
          report=career/reports/algorithms-${{ steps.lesson.outputs.number }}.txt
          if ! git diff --exit-code -- "$report"; then
            echo "::error::Закоммиченный $report не совпадает с прогоном в CI (или его нет в ветке). Перегенерируйте: gradle :career:testReport -Plesson=${{ steps.lesson.outputs.number }}"
            exit 1
          fi
          if [ -n "$(git ls-files --others --exclude-standard -- "$report")" ]; then
            echo "::error::Отчёта $report нет в pull request. Запустите testReport и закоммитьте файл."
            exit 1
          fi

      - name: Красных тестов нет
        run: |
          report=career/reports/algorithms-${{ steps.lesson.outputs.number }}.txt
          cat "$report"
          if ! grep -q "^Итог: все тесты урока зелёные$" "$report"; then
            echo "::error::В $report есть красные тесты — урок не сдан"
            exit 1
          fi

      - name: HTML-отчёт тестов
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: career-algorithms-test-report
          path: career/algorithms/build/reports/tests/test
